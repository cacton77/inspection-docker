# Relative paths below resolve against this file's directory (docker/), so
# host paths are ../<dir> and the build context is the repo root. The scripts
# run compose from the repo root with `-f docker/docker-compose.yaml
# --env-file .env`, since compose would otherwise look for docker/.env.
# The project name is pinned so it doesn't default to "docker"; connect.sh
# finds `compose run` containers by the ${CONTAINER_NAME}-<service>-run- prefix.
name: ${CONTAINER_NAME:-ros2-docker-template}

# ============================================================
# Extension fields (YAML anchors for DRY config)
# ============================================================

x-common-env: &common-env
  DISPLAY: ${DISPLAY:-:1}
  QT_X11_NO_MITSHM: "1"
  XAUTHORITY: /tmp/.docker.xauth
  XDG_RUNTIME_DIR: /tmp/runtime-${USERNAME:-macs}
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
  CYCLONEDDS_URI: ${CYCLONEDDS_URI:-file:///config/dds/cyclonedds.xml}
  # FastDDS reads the legacy var on Humble, the new one on Jazzy. Set both.
  FASTRTPS_DEFAULT_PROFILES_FILE: ${FASTRTPS_DEFAULT_PROFILES_FILE:-/config/dds/fastdds.xml}
  FASTDDS_DEFAULT_PROFILES_FILE: ${FASTDDS_DEFAULT_PROFILES_FILE:-/config/dds/fastdds.xml}
  # PartField package lives at the compose mount (./models:/models); make it importable
  PYTHONPATH: /models/PartField
  # PLM catalog (plm_bridge): which backends to host. 3DX credentials follow.
  PLM_BACKENDS: ${PLM_BACKENDS:-dx3}
  # 3DX integration (loaded from .env)
  DX_PASSPORT_URL: ${DX_PASSPORT_URL:-}
  DX_SPACE_URL: ${DX_SPACE_URL:-}
  DX_TENANT: ${DX_TENANT:-}
  DX_USERNAME: ${DX_USERNAME:-}
  DX_PASSWORD: ${DX_PASSWORD:-}
  DX_SECURITY_CONTEXT: ${DX_SECURITY_CONTEXT:-}
  DX_BOOKMARK_SCOPE: ${DX_BOOKMARK_SCOPE:-}
  DX_COLLAB_SPACE: ${DX_COLLAB_SPACE:-}
  DX_MATURITY_FILTER: ${DX_MATURITY_FILTER:-}
  # Optional STOMP/AMQP bridge; unset means the catalog polls instead.
  DX_JMS_BROKER_URL: ${DX_JMS_BROKER_URL:-}
  # Relate uploaded Documents to their item (off: the UW tenant has no such service).
  DX_DOCUMENT_LINKS: ${DX_DOCUMENT_LINKS:-}
  CATALOG_SYNC_INTERVAL: ${CATALOG_SYNC_INTERVAL:-300}
  # Catalog cache root inside the container, matching the ./catalog mount below.
  CATALOG_ROOT: /catalog
  CELL_ID: ${CELL_ID:-alpha}
  # Prefix for uploaded titles; set TEST_PLM_BRIDGE_ when testing on a tenant.
  CATALOG_TITLE_PREFIX: ${CATALOG_TITLE_PREFIX:-}
  # How the plm-bridge CLI asks ViewpointGeneration to describe plan files.
  PLAN_DESCRIBE_CMD: ${PLAN_DESCRIBE_CMD:-python3 -m viewpoint_generation.plan_io describe}
  # The picker binds this port. These services use network_mode: host, so it is
  # reachable at http://localhost:${PICKER_PORT} with no port mapping needed.
  PICKER_PORT: ${PICKER_PORT:-5050}

x-nvidia-env: &nvidia-env
  <<: *common-env
  NVIDIA_VISIBLE_DEVICES: all
  NVIDIA_DRIVER_CAPABILITIES: all

x-common-build-args: &common-build-args
  ROS_DISTRO: ${ROS_DISTRO:-humble}
  USERNAME: ${USERNAME:-macs}
  UID: ${HOST_UID:-1000}
  GID: ${HOST_GID:-1000}
  VIDEO_GID: 44
  DIALOUT_GID: 20

x-common-volumes: &common-volumes
  - /tmp/.X11-unix:/tmp/.X11-unix:rw
  - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
  - ./entrypoint.sh:/entrypoint.sh:ro
  # The whole colcon workspace (src/ plus build/, install/, log/) lives on the
  # host, so builds persist across containers and colcon only rebuilds what
  # changed.
  - ../ros2_ws:/workspaces/ros2_ws:rw
  - ../data:/data:rw
  - ../models:/models:rw
  - ../config:/config:rw
  - ../catalog:/catalog:rw
  - /dev:/dev
  - /tmp/runtime-${USERNAME:-macs}:/tmp/runtime-${USERNAME:-macs}:rw

x-common-service: &common-service
  container_name: ${CONTAINER_NAME:-ros2-docker-template}
  image: ${CONTAINER_NAME:-ros2-docker-template}:${ROS_DISTRO:-humble}
  stdin_open: true
  tty: true
  network_mode: host
  ipc: host
  privileged: true
  device_cgroup_rules:
    - 'c *:* rmw'
  working_dir: /workspaces/ros2_ws
  user: ${HOST_UID:-1000}:${HOST_GID:-1000}
  command: ["/bin/bash"]

# ============================================================
# Services (one per platform profile)
# ============================================================

services:
  # ---- Linux x86_64, no GPU ----
  linux:
    <<: *common-service
    profiles: ["linux"]
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile.${ROS_DISTRO:-humble}
      network: host
      args:
        <<: *common-build-args
        BASE_IMAGE: osrf/ros:${ROS_DISTRO:-humble}-desktop-full
        # Zivid SDK compute backend: no discrete GPU -> Intel iGPU OpenCL
        ZIVID_BACKEND: opencl
    environment:
      <<: *common-env
    volumes: *common-volumes
    group_add:
      - dialout

  # ---- Linux x86_64 with discrete NVIDIA GPU ----
  linux-gpu:
    <<: *common-service
    profiles: ["linux-gpu"]
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile.${ROS_DISTRO:-humble}
      network: host
      args:
        <<: *common-build-args
        BASE_IMAGE: osrf/ros:${ROS_DISTRO:-humble}-desktop-full
        ZIVID_BACKEND: cuda
    environment:
      <<: *nvidia-env
    volumes: *common-volumes
    group_add:
      - dialout
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility, compute, graphics]
